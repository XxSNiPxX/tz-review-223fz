# Public deployment on a CPU VPS. Usage (on the server, in the project dir):
#   docker compose -f deploy/docker-compose.vps.yml up -d --build
services:
  review:
    build:
      context: ..
      args:
        WITH_LLM: "${WITH_LLM:-0}"        # 1 = compile llama.cpp and allow the Qwen model (needs ~10 GB RAM)
        LITE: "${LITE:-0}"                # 1 = no PyTorch models (servers with <2 GB RAM)
    image: tz-review:vps
    container_name: tz-review
    ports: ["80:8000"]
    environment:
      - REVIEW_HOST=0.0.0.0
      - REVIEW_PORT=8000
      - REVIEW_USE_LLM=${WITH_LLM:-0}
      - REVIEW_LITE=${LITE:-0}
      - REVIEW_BASIC_AUTH=${REVIEW_BASIC_AUTH:-}     # "user:password" to protect the page; empty = open to everyone
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    restart: always
