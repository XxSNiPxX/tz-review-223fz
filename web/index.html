<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка ТЗ · 223-ФЗ</title>
<style>
  :root { --bg:#f3f6fc; --card:#fff; --ink:#0b1b3a; --muted:#5b6b8c; --line:#d9e1f2; --tint:#e6ecf9; --accent:#003092; --accent2:#0a46c0;
          --err:#b42318; --errbg:#fee4e2; --risk:#b54708; --riskbg:#fef0c7; --check:#5b4bc4; --checkbg:#ece9fb; --note:#475467; --notebg:#eef1f6; --ok:#067647; --okbg:#d1fadf; }
  :root[data-theme="dark"] { --bg:#0b1326; --card:#121c33; --ink:#e8edf8; --muted:#9fb0d0; --line:#26375c; --tint:#17264a; --accent:#2f6be0; --accent2:#5b8cff;
          --errbg:#4a1d1a; --riskbg:#4a3312; --checkbg:#2b2557; --notebg:#1d2a47; --okbg:#143d2b; --err:#ff8a80; --risk:#fdb022; --check:#b3a8ff; --ok:#6ce9a6; --note:#b0bdd6; }
  * { box-sizing:border-box; min-width:0 }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "ALS Sirius","Golos Text","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
  a { color:var(--accent2) } button { font:inherit; cursor:pointer }
  .btn { padding:8px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:600 }
  .btn:hover { background:var(--accent2); border-color:var(--accent2) } .btn.light { background:transparent; color:var(--accent2); border-color:var(--line) } .btn.light:hover { background:var(--tint) }
  .btn.small { padding:5px 10px; font-size:13px } .btn:disabled { opacity:.5; cursor:default }
  .muted { color:var(--muted) }
  header { display:flex; align-items:center; gap:14px; padding:8px 18px; background:var(--card); border-bottom:3px solid var(--accent); position:sticky; top:0; z-index:10 }
  header img { height:28px } :root[data-theme="dark"] header img { filter:brightness(0) invert(1) }
  header .title { font-weight:700; color:var(--accent) } :root[data-theme="dark"] header .title { color:#cfe0ff }
  header .sp { flex:1 } header .who { font-size:13px; color:var(--muted) } .icon { background:none; border:1px solid var(--line); border-radius:8px; padding:4px 9px; color:var(--ink) }
  #start { max-width:760px; margin:40px auto; padding:0 16px; display:grid; gap:18px }
  .drop { display:block; background:var(--card); border:2px dashed #9fb7ea; border-radius:16px; padding:48px 20px; text-align:center; cursor:pointer; transition:.15s }
  .drop:hover, .drop.over { border-color:var(--accent2); background:var(--tint) } .drop input { display:none }
  .drop h2 { margin:6px 0; font-size:20px } .drop p { margin:0; color:var(--muted) } .drop .big { font-size:34px }
  .samples { text-align:center; font-size:13px; color:var(--muted) } .samples button { background:none; border:none; color:var(--accent2); text-decoration:underline; padding:0 4px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 0 }
  .card h3 { font-size:14px; margin:10px 16px 6px; color:var(--muted); font-weight:600 }
  .row { display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid var(--line); cursor:pointer } .row:hover { background:var(--tint) }
  .row .name { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .row .when { font-size:12px; color:var(--muted) }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; background:var(--line) } .dot.bad { background:var(--err) } .dot.mid { background:var(--risk) } .dot.ok { background:var(--ok) }
  #overlay { position:fixed; inset:0; background:rgba(11,19,38,.55); display:none; place-items:center; z-index:50; backdrop-filter:blur(2px) }
  #overlay .box { background:var(--card); border-radius:16px; padding:28px 34px; min-width:300px; max-width:90vw; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35) }
  .spin { width:42px; height:42px; border:4px solid var(--tint); border-top-color:var(--accent2); border-radius:50%; animation:sp .9s linear infinite; margin:0 auto 14px }
  @keyframes sp { to { transform:rotate(360deg) } } .steps { text-align:left; margin:12px auto 0; font-size:13px; color:var(--muted); width:max-content; max-width:80vw } .steps .on { color:var(--ink); font-weight:600 } .steps .done { color:var(--ok) }
  .mini { width:15px; height:15px; border-width:2px; margin:0; display:inline-block; vertical-align:middle }
  #review { display:none; height:calc(100vh - 51px); grid-template-rows:auto 1fr } #review.on { display:grid }
  .bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 18px; background:var(--card); border-bottom:1px solid var(--line) }
  .bar .doc-name { font-weight:700; max-width:30vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .verdict { padding:4px 10px; border-radius:999px; font-weight:600; font-size:13px; background:var(--okbg); color:var(--ok) } .verdict.bad { background:var(--errbg); color:var(--err) }
  .counts { display:flex; gap:12px; font-size:13px } .counts b { font-size:15px } .c-err b { color:var(--err) } .c-risk b { color:var(--risk) } .c-check b { color:var(--check) }
  .menu { position:relative } .menu .list { position:absolute; right:0; top:110%; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.18); min-width:270px; display:none; z-index:20; padding:6px }
  .menu.open .list { display:block } .menu .list button { display:block; width:100%; text-align:left; background:none; border:none; padding:8px 10px; border-radius:8px; color:var(--ink) } .menu .list button:hover { background:var(--tint) }
  .menu .list small { display:block; color:var(--muted); font-size:12px }
  .progress { height:3px; background:var(--tint); position:relative; overflow:hidden } .progress i { position:absolute; inset:0 auto 0 0; background:var(--accent2); transition:width .4s }
  .llmline { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px }
  .panes { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(340px,.9fr); min-height:0 }
  .doc { overflow:auto; padding:22px 30px; background:var(--card); border-right:1px solid var(--line); font:14.5px/1.65 Georgia,"Times New Roman",serif }
  .doc h4 { font:600 14px system-ui,sans-serif; margin:18px 0 6px } .doc p { margin:0 0 8px; position:relative; padding-left:44px }
  .ln { position:absolute; left:0; top:2px; width:38px; text-align:right; font:500 11px/1.4 system-ui,sans-serif; color:var(--muted); user-select:none; cursor:pointer }
  .ln:hover { color:var(--accent2) } td.ln { position:static; width:auto; padding:3px 6px; background:var(--tint); white-space:nowrap }
  .doc table { margin-left:0 } .flash { animation:flash 1.6s ease-out } @keyframes flash { 0%,30% { box-shadow:0 0 0 3px var(--accent2) } 100% { box-shadow:0 0 0 0 transparent } }
  .ref { display:inline-block; font:600 11.5px/1.6 system-ui,sans-serif; padding:0 7px; border-radius:6px; background:var(--tint); color:var(--accent2); border:1px solid var(--line); cursor:pointer; margin:0 3px 3px 0; text-decoration:none; white-space:nowrap }
  .ref:hover { border-color:var(--accent2) } .ref.main { background:var(--accent2); color:#fff; border-color:var(--accent2) }
  .doc del { background:var(--errbg); color:var(--err); text-decoration:line-through } .doc ins { background:var(--okbg); color:var(--ok); text-decoration:none; font-weight:600 }
  .gh { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:0 0 8px; background:var(--card); cursor:pointer }
  .gh .gh-h { display:flex; gap:8px; align-items:center; padding:7px 10px; background:var(--tint); font-size:12.5px } .gh .gh-h .sp { flex:1 }
  .gh .line { font:12.5px/1.5 ui-monospace,"Fira Mono",Menlo,monospace; padding:4px 10px 4px 26px; position:relative; white-space:pre-wrap; word-break:break-word }
  .gh .line::before { position:absolute; left:9px; font-weight:700 } .gh .minus { background:var(--errbg) } .gh .minus::before { content:"−"; color:var(--err) }
  .gh .plus { background:var(--okbg) } .gh .plus::before { content:"+"; color:var(--ok) } .gh .line del { background:rgba(180,35,24,.25); text-decoration:none } .gh .line ins { background:rgba(6,118,71,.25); text-decoration:none }
  .tag { font-size:11px; padding:0 7px; border-radius:999px; background:var(--okbg); color:var(--ok) } .tag.no { background:var(--riskbg); color:var(--risk) }
  .doc table { border-collapse:collapse; width:100%; margin:6px 0 14px; font-size:13px } .doc td, .doc th { border:1px solid var(--line); padding:3px 7px; vertical-align:top } .doc th { background:var(--tint); text-align:left }
  .doc caption { text-align:left; font-style:italic; color:var(--muted); padding-bottom:4px }
  .frag { cursor:pointer; border-radius:3px } .frag.ERROR { background:var(--errbg); box-shadow:inset 0 -2px 0 var(--err) } .frag.RISK { background:var(--riskbg); box-shadow:inset 0 -2px 0 var(--risk) }
  .frag.CHECK { background:var(--checkbg); box-shadow:inset 0 -2px 0 var(--check) } .frag.NOTE { box-shadow:inset 0 -2px 0 var(--line) } .frag.FIXED { background:var(--okbg); box-shadow:inset 0 -2px 0 var(--ok) }
  .frag.sel { outline:2px solid var(--accent2); outline-offset:2px }
  .num { display:inline-block; min-width:18px; height:18px; padding:0 5px; border-radius:9px; font:600 11px/18px system-ui; text-align:center; color:#fff; background:var(--note); margin-left:4px; vertical-align:2px }
  .num.ERROR { background:var(--err) } .num.RISK { background:var(--risk) } .num.CHECK { background:var(--check) } .num.FIXED { background:var(--ok) }
  :root[data-theme="dark"] .num { color:#0b1326 }
  .plain:hover { background:var(--tint); cursor:context-menu }
  .side { overflow:auto; padding:14px 16px 40px; background:var(--bg) }
  .filter { display:flex; gap:8px; align-items:center; margin-bottom:10px } .filter select { font:inherit; padding:5px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink) }
  .group > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:8px 2px; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted) }
  .group > summary::-webkit-details-marker { display:none } .group > summary::before { content:"▸"; transition:.15s } .group[open] > summary::before { transform:rotate(90deg) }
  .group > summary .n { background:var(--line); color:var(--ink); border-radius:999px; padding:0 8px; font-size:12px }
  .f { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--note); border-radius:10px; padding:10px 12px; margin:0 0 8px; cursor:pointer }
  .f.ERROR { border-left-color:var(--err) } .f.RISK { border-left-color:var(--risk) } .f.CHECK { border-left-color:var(--check) } .f.sel { box-shadow:0 0 0 2px var(--accent2) }
  .f .h { display:flex; gap:8px; align-items:baseline } .f .h b { font-size:13.5px } .f .h .sp { flex:1 }
  .f .short { color:var(--muted); font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:2px }
  .f .body { display:none; margin-top:8px; font-size:13.5px } .f.sel .body { display:block } .f.sel .short { display:none }
  .f .where { font-size:12px; color:var(--muted); margin-bottom:6px } .f .expl { margin:0 0 8px }
  .f .hint { background:var(--tint); border-radius:8px; padding:7px 10px; font-size:13px; margin-bottom:8px }
  .f .acts, .acts { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .f .fb { margin-left:auto; display:flex; gap:4px } .f .fb button { background:none; border:1px solid var(--line); border-radius:8px; padding:3px 8px; color:var(--ink) } .f .fb button.on { background:var(--tint); border-color:var(--accent2) }
  .f details.ev { margin-top:8px; font-size:12px; color:var(--muted) } .f details.ev a { cursor:pointer; margin-right:8px }
  .llmwait { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; margin:4px 0 }
  .diff { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:8px 0; font:13px/1.5 Georgia,serif }
  .diff div { padding:7px 10px } .diff .was { background:var(--errbg) } .diff .now { background:var(--okbg) } .diff .lbl { font:600 11px system-ui; text-transform:uppercase; color:var(--muted); display:block }
  .diff del { color:var(--err); text-decoration:line-through } .diff ins { color:var(--ok); text-decoration:none; font-weight:700 }
  textarea { width:100%; min-height:110px; font:13.5px/1.5 Georgia,serif; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); resize:vertical }
  .pop { background:var(--card); border:1px solid var(--accent2); border-radius:10px; padding:10px 12px; margin:6px 0; font:13px system-ui; box-shadow:0 8px 24px rgba(0,0,0,.15) }
  .pop select, .pop input { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink) }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--card); color:var(--ink); border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:10px; padding:10px 16px; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:60; font-size:13px; max-width:90vw }
  .toast.warn { border-left-color:var(--risk) }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); max-width:760px; width:92vw } dialog pre { white-space:pre-wrap; font-size:12px; background:var(--bg); padding:10px; border-radius:8px; max-height:60vh; overflow:auto }
  @media (max-width:900px) { .panes { grid-template-columns:1fr; grid-template-rows:55vh auto } .doc { border-right:0; border-bottom:1px solid var(--line) } .bar .doc-name { max-width:60vw } header .title { font-size:13px } }
</style>
</head>
<body>
<header>
  <img src="/static/logo.svg" alt="МФТИ">
  <span class="title">Проверка технического задания · 223-ФЗ</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button class="icon" id="theme" title="Тема" onclick="toggleTheme()">☾</button>
</header>

<section id="start">
  <label class="drop" id="drop">
    <input type="file" id="file" accept=".docx,.doc,.rtf,.odt,.pdf,.xlsx,.xls">
    <div class="big">📄</div>
    <h2>Загрузите техническое задание</h2>
    <p>Перетащите файл сюда или нажмите, чтобы выбрать · DOCX, DOC, PDF, RTF, XLSX</p>
  </label>
  <div class="samples" id="samples"></div>
  <div class="card" id="recent" style="display:none"><h3>Недавние проверки</h3><div id="jobs"></div></div>
</section>

<section id="review">
  <div>
    <div class="bar">
      <button class="btn light small" onclick="goHome()">← Назад</button>
      <span class="doc-name" id="docname"></span>
      <span class="verdict" id="verdict"></span>
      <span class="counts" id="counts"></span>
      <span style="flex:1"></span>
      <span class="llmline" id="llmline"></span>
      <div class="menu" id="dl">
        <button class="btn small" onclick="this.parentElement.classList.toggle('open')">Скачать ▾</button>
        <div class="list">
          <button id="dl-edited" onclick="dl('edited')">Исправленный документ (DOCX)<small>исходный файл с применёнными правками</small></button>
          <button id="dl-annot" onclick="dl('annot')">Документ с замечаниями (DOCX)<small>подсветка и комментарии Word</small></button>
          <button onclick="dl('docx')">Заключение (DOCX)<small>отчёт для закупочной комиссии</small></button>
          <button onclick="dl('html')">Заключение для печати / PDF</button>
          <button onclick="dl('json')">Данные (JSON)</button>
        </div>
      </div>
    </div>
    <div class="progress" id="prog" style="display:none"><i id="progi" style="width:0"></i></div>
  </div>
  <div class="panes">
    <div class="doc" id="doc"></div>
    <div class="side">
      <div class="filter"><span class="muted" style="font-size:13px">Категория:</span><select id="catf" onchange="renderList()"></select><span class="muted" id="fcount" style="font-size:12px"></span>
        <label class="muted" style="font-size:12px;margin-left:auto" title="Показывать в документе, что было изменено"><input type="checkbox" id="showdiff" checked onchange="renderDoc()"> правки в тексте</label></div>
      <div id="flist"></div>
    </div>
  </div>
</section>

<div id="overlay"><div class="box"><div class="spin"></div><div id="ovtitle" style="font-weight:700">Проверяем документ</div><div class="steps" id="ovsteps"></div></div></div>
<dialog id="dlg"><div id="dlgbody"></div><div style="text-align:right;margin-top:10px"><button class="btn small" onclick="dlg.close()">Закрыть</button></div></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS = {CONTRADICTION:'Противоречие', INCORRECT_CHARACTERISTIC:'Некорректная характеристика', COMPLETENESS:'Комплектность и полнота', WRONG_OKPD2:'Код ОКПД 2',
  WARRANTY:'Гарантийные условия', STANDARDS:'Стандарты', COMPETITION_RESTRICTION:'Ограничение конкуренции', OUT_OF_SCOPE_PROVISION:'Не относится к ТЗ', FORM:'Оформление'};
const GROUPS = [['ERROR','Ошибки'],['RISK','Риски'],['CHECK','Требует проверки'],['NOTE','Оформление и замечания']];
let R = null, RID = null, sel = null, poll = null;

function applyTheme(t){ if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); $('#theme').textContent = t==='dark'?'☀':'☾'; }
function toggleTheme(){ const t = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; try{ localStorage.setItem('theme', t); }catch(e){} applyTheme(t); }
try{ applyTheme(localStorage.getItem('theme')||'dark'); }catch(e){ applyTheme('dark'); }
const _fetch = window.fetch; window.fetch = async (...a) => { const r = await _fetch(...a); if (r.status === 401 && String(a[0]).startsWith('/api/')) location.href = '/login'; return r; };
function toast(msg, warn){ const t=document.createElement('div'); t.className='toast'+(warn?' warn':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), warn?9000:5000); }

function grp(f){ if (f.severity==='NOTE') return 'NOTE'; if (f.disposition!=='FLAGGED') return 'CHECK'; return f.severity; }

/* ---------- start page ---------- */
async function whoami(){ try{ const j = await (await fetch('/api/me')).json(); const u = j.user;
  $('#who').innerHTML = u ? `${esc(u.name||u.email)}${u.provider==='demo'?' · демо':''} · <a href="/logout">выйти</a>` : ''; }catch(e){} }
async function samples(){ try{ const s = await (await fetch('/api/samples')).json();
  if (s.length) $('#samples').innerHTML = 'Нет файла под рукой? Попробуйте пример: ' + s.map(x=>`<button onclick="runSample('${x.name}')">${esc(x.title)}</button>`).join(' · '); }catch(e){} }
async function jobs(){ const js = (await (await fetch('/api/reviews')).json()).filter(j=>!j.legacy && !String(j.source).startsWith('EIS'));
  $('#recent').style.display = js.length ? 'block' : 'none';
  $('#jobs').innerHTML = js.slice(0,8).map(j=>{ const s = j.summary||{}; const e = Object.values(s).reduce((a,v)=>a+(v.errors||0),0), r = Object.values(s).reduce((a,v)=>a+(v.risks||0),0);
    const d = j.status!=='done' ? '' : e ? 'bad' : r ? 'mid' : 'ok';
    const what = j.status==='done' ? ([e?`ошибок ${e}`:'', r?`рисков ${r}`:''].filter(Boolean).join(' · ') || 'без ошибок') : 'проверяется…';
    return `<div class="row" onclick="${j.status==='done'?`openReview('${j.review_id}')`:''}"><span class="dot ${d}"></span><span class="name">${esc(j.source)}</span>
      <span class="when">${what}</span><span class="when">${esc((j.started||'').slice(5,16).replace('T',' '))}</span></div>`; }).join(''); }

const drop = $('#drop'); $('#file').addEventListener('change', e=>upload(e.target.files[0]));
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault(); drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault(); drop.classList.remove('over');}));
drop.addEventListener('drop', e=>upload(e.dataTransfer.files[0]));

/* ---------- loading overlay ---------- */
const STEPS = ['Загрузка файла','Чтение структуры: разделы, таблицы, позиции','Проверка: противоречия, характеристики, ОКПД 2, стандарты, гарантия','Подготовка отчёта'];
function overlay(on, step, title){ $('#overlay').style.display = on ? 'grid' : 'none'; if(!on) return; if (title) $('#ovtitle').textContent = title;
  $('#ovsteps').innerHTML = STEPS.map((s,i)=>`<div class="${i<step?'done':i===step?'on':''}">${i<step?'✓':i===step?'›':'·'} ${s}</div>`).join(''); }
async function upload(file){ if(!file) return; overlay(true, 0, file.name);
  const fd = new FormData(); fd.append('file', file);
  const r = await fetch('/api/reviews',{method:'POST',body:fd}); const j = await r.json(); $('#file').value='';
  if(!r.ok){ overlay(false); toast('Не удалось проверить файл: ' + (j.detail||'ошибка'), true); return; } await waitDone(j.review_id); }
async function runSample(name){ overlay(true, 0, name); const r = await fetch('/api/samples/'+name,{method:'POST'}); const j = await r.json(); if(!r.ok){ overlay(false); toast(j.detail||'ошибка', true); return; } await waitDone(j.review_id); }
async function waitDone(rid){ overlay(true, 1);
  for (let i=0;i<300;i++){ const r = await fetch('/api/reviews/'+rid); if(r.status===404){ overlay(false); toast('Проверка не найдена', true); return; }
    const j = await r.json(); if (j.status==='done'){ overlay(true, 3); await new Promise(r=>setTimeout(r,300)); overlay(false); openReview(rid); return; }
    if (j.status==='error'){ overlay(false); toast('Ошибка проверки: '+j.error, true); return; }
    if (i===1) overlay(true, 2); await new Promise(r=>setTimeout(r,700)); } }

/* ---------- review ---------- */
function goHome(){ clearTimeout(poll); $('#review').classList.remove('on'); $('#start').style.display='grid'; jobs(); }
async function openReview(rid, keepClause){ const j = await (await fetch('/api/reviews/'+rid)).json(); R = j.report; RID = rid; window._job = j;
  $('#start').style.display='none'; $('#review').classList.add('on');
  R.findings.sort((a,b)=> GROUPS.findIndex(g=>g[0]===grp(a)) - GROUPS.findIndex(g=>g[0]===grp(b)));
  R.findings.forEach((f,i)=>f._n=i+1);
  const c = R.conclusion||{}; $('#docname').textContent = R.source; $('#docname').title = R.source;
  const n = g => R.findings.filter(f=>grp(f)===g).length;
  const v = $('#verdict'); v.textContent = n('ERROR') ? 'Требует доработки' : 'Существенных ошибок нет'; v.className = 'verdict' + (n('ERROR')?' bad':'');
  const nfix = new Set((R.edits||[]).map(e=>e.clause_id)).size;
  $('#counts').innerHTML = `<span class="c-err"><b>${n('ERROR')}</b> ошибок</span><span class="c-risk"><b>${n('RISK')}</b> рисков</span><span class="c-check"><b>${n('CHECK')}</b> проверить</span>` + (nfix?`<span style="color:var(--ok)"><b>${nfix}</b> исправлено</span>`:'');
  $('#dl-edited').style.display = (j.upload_is_docx && (R.edits||[]).length) ? 'block' : 'none'; $('#dl-annot').style.display = j.upload_is_docx ? 'block' : 'none';
  const cats = [...new Set(R.findings.map(f=>f.case_category))]; const cur = $('#catf').value;
  $('#catf').innerHTML = '<option value="">все</option>' + cats.map(k=>`<option value="${k}">${CATS[k]||k}</option>`).join(''); if (cats.includes(cur)) $('#catf').value = cur;
  renderDoc(); renderList(); llmStatus(j);
  if (keepClause) { const f = R.findings.find(x=>x.clause_id===keepClause); if (f) select(f._n, true); } }

function llmStatus(j){ clearTimeout(poll); const st = j.llm_status, done = j.llm_done||0, tot = j.llm_total||0;
  if (st==='pending' || st==='running'){ $('#prog').style.display='block'; $('#progi').style.width = (tot ? Math.max(5, Math.round(100*done/tot)) : 5)+'%';
    $('#llmline').innerHTML = `<span class="spin mini"></span> Пояснения локальной модели: ${done}/${tot}`;
    poll = setTimeout(async ()=>{ if (document.querySelector('.pop, textarea, .diff')) { llmStatus(j); return; } const k = sel && R.findings.find(f=>f._n===sel); await openReview(RID, k && k.clause_id); }, 5000); }
  else { $('#prog').style.display='none'; $('#llmline').innerHTML = st==='done' ? '✓ пояснения модели готовы' : ''; } }

const fixed = () => new Set(R.edited_clauses||[]);
let ANCH = {}, NUM = {};
function indexView(){ ANCH = {}; NUM = {}; let pn = 0, tn = 0;
  (R.document_view||[]).forEach(b=>{ if (b.type==='p') b.num ||= '¶'+(++pn); if (b.type==='table'){ tn++; b.num ||= 'Т'+tn; b.rows.forEach((r,i)=>{ r.num ||= 'Т'+tn+'.'+(i+1); }); } });
  (R.document_view||[]).forEach(b=>{ if (b.type==='p'){ NUM[b.clause_id]=b.num; if (b.anchor) ANCH[b.anchor]=b.clause_id; }
    if (b.type==='table') b.rows.forEach(r=>{ NUM[r.clause_id]=r.num; if (r.anchor) ANCH[r.anchor]=r.clause_id; }); }); }
function cidOf(anchor){ if (ANCH[anchor]) return ANCH[anchor]; const k = Object.keys(ANCH).find(a=>anchor.startsWith(a) || a.startsWith(anchor)); return k && ANCH[k]; }
/* edits per clause: first original, last applied text */
function editsBy(){ const m = {}; (R.edits||[]).forEach(e=>{ const x = m[e.clause_id]; if (!x) m[e.clause_id] = {first:e.original_text||'', last:e.new_text||'', n:1, items:[e]}; else { x.last = e.new_text||''; x.n++; x.items.push(e); } }); return m; }
function byClause(){ const m = {}; R.findings.forEach(f=>{ if(f.clause_id) (m[f.clause_id] ||= []).push(f); }); return m; }
function worst(fs){ for (const g of ['ERROR','RISK','CHECK','NOTE']) if (fs.some(f=>grp(f)===g)) return g; return 'NOTE'; }
function marks(fs){ return fs.map(f=>`<span class="num ${grp(f)}">${f._n}</span>`).join(''); }
function body(id, text){ const e = editsBy()[id]; if (!e || !$('#showdiff').checked) return esc(text); const d = diff(e.first, text); return d.was === esc(e.first) && d.now === esc(text) ? esc(text) : inline(e.first, text); }
function inline(a, b){ const A = a.split(/(\s+)/), B = b.split(/(\s+)/); const n=A.length, m=B.length; const L = Array.from({length:n+1},()=>new Int16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i=0,j=0,o=''; while(i<n||j<m){ if(i<n&&j<m&&A[i]===B[j]){ o+=esc(A[i]); i++; j++; } else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){ o+=`<ins>${esc(B[j])}</ins>`; j++; } else { o+=`<del>${esc(A[i])}</del>`; i++; } } return o; }
function fragP(id, text){ const fs = byClause()[id];
  if (fs) return `<span class="frag ${worst(fs)}" id="c_${id}" onclick="select(${fs[0]._n})">${body(id, text)}${marks(fs)}</span>`;
  if (fixed().has(id)) return `<span class="frag FIXED" id="c_${id}" onclick="showFix('${id}')">${body(id, text)}<span class="num FIXED">✓</span></span>`;
  return `<span class="plain" id="c_${id}" onclick="missed('${id}')" title="Щёлкните, если здесь есть проблема, которую система пропустила">${esc(text)}</span>`; }
function renderDoc(){ const m = byClause(); indexView(); const E = editsBy();
  $('#doc').innerHTML = (R.document_view||[]).map(b=>{
    if (b.type==='h') return `<h4>${esc(b.text)}</h4>`;
    if (b.type==='p') return `<p id="b_${b.clause_id}"><span class="ln" title="${esc(b.anchor||'')}" onclick="copyRef('${b.num}')">${esc(b.num||'')}</span>${fragP(b.clause_id, b.text)}</p>`;
    if (b.type==='table') return `<table>${b.caption?`<caption>${esc(b.num||'')} · ${esc(b.caption)}</caption>`:`<caption>${esc(b.num||'')}</caption>`}<tr><th></th>${b.header.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${b.rows.map(r=>{ const fs = m[r.clause_id];
        const cls = fs ? `frag ${worst(fs)}` : fixed().has(r.clause_id) ? 'frag FIXED' : '';
        const mk = fs ? marks(fs) : fixed().has(r.clause_id) ? '<span class="num FIXED">✓</span>' : '';
        const old = E[r.clause_id] && $('#showdiff').checked ? E[r.clause_id].first.split(' | ') : null;
        const onclk = fs ? `select(${fs[0]._n})` : fixed().has(r.clause_id) ? `showFix('${r.clause_id}')` : '';
        return `<tr class="${cls}" id="c_${r.clause_id}" ${onclk?`onclick="${onclk}"`:''}><td class="ln" title="${esc(r.anchor||'')}">${esc(r.num||'')}</td>${r.cells.map((c,i)=>`<td>${old && old[i]!==undefined && old[i].trim()!==c.trim() ? inline(old[i].trim(), c) : esc(c)}${i===r.cells.length-1?mk:''}</td>`).join('')}</tr>`; }).join('')}</table>`;
    return ''; }).join('') || '<p class="muted">Текст документа недоступен.</p>'; }

/* scroll to a numbered place in the document and flash it */
function goTo(cid){ const el = document.getElementById('c_'+cid) || document.getElementById('b_'+cid); if (!el) return;
  el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function copyRef(num){ try{ navigator.clipboard.writeText(num); toast('Ссылка '+num+' скопирована'); }catch(e){} }
/* every anchor string inside a text becomes a chip with the paragraph / row number */
function linkify(html){ const keys = Object.keys(ANCH).sort((a,b)=>b.length-a.length); for (const a of keys){ const e = esc(a); if (!html.includes(e)) continue; const cid = ANCH[a];
    html = html.split(e).join(`<a class="ref" onclick="event.stopPropagation();goTo('${cid}')" title="${e}">${esc(NUM[cid]||'')}</a>`); } return html; }
function refs(f){ const ids = []; if (f.clause_id) ids.push(f.clause_id); (f.anchors||[]).forEach(a=>{ const c = cidOf(a); if (c && !ids.includes(c)) ids.push(c); });
  return ids.map((c,i)=>`<a class="ref ${i===0?'main':''}" onclick="event.stopPropagation();goTo('${c}')" title="Показать в документе">${esc(NUM[c]||c)}</a>`).join(''); }

/* ---------- GitHub-style list of applied changes ---------- */
function ghCard(cid){ const e = editsBy()[cid]; if (!e) return ''; const last = e.items[e.items.length-1]; const d = diffLines(e.first, e.last);
  const how = {manual:'вручную', suggestion:'автоисправление', llm:'LLM', llm_edited:'LLM + правка'}[last.method] || last.method;
  const cats = [...new Set(e.items.flatMap(x=>{ try{ return JSON.parse(x.categories||'[]'); }catch(_){ return []; } }))].filter(Boolean).map(k=>CATS[k]||k).join(', ');
  return `<div class="gh" onclick="goTo('${cid}')"><div class="gh-h"><a class="ref main">${esc(NUM[cid]||cid)}</a><b>${esc(cats||'Правка')}</b><span class="sp"></span>
    <span class="tag ${last.resolved?'':'no'}">${last.resolved?'замечание снято':'осталось замечание'}</span><span class="muted">${esc(how)}${e.n>1?` · ${e.n} правки`:''} · ${esc((last.created_at||'').slice(11,16))}</span></div>
    <div class="line minus">${d.was}</div><div class="line plus">${d.now || '<i>фрагмент удалён</i>'}</div></div>`; }
function diffLines(a, b){ if (b==='') return {was:esc(a), now:''}; const d = diff(a, b); return d; }
function showFix(cid){ const g = document.getElementById('fixed_group'); if (g){ g.open = true; } const el = document.getElementById('gh_'+cid); if (el){ el.scrollIntoView({block:'nearest',behavior:'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } }

function renderList(){ const cat = $('#catf').value; const fs = R.findings.filter(f=>!cat || f.case_category===cat);
  $('#fcount').textContent = `${fs.length} замечаний`;
  const E = editsBy(); const ids = Object.keys(E);
  const fixedHtml = ids.length ? `<details class="group" id="fixed_group" open><summary>Исправлено <span class="n">${ids.length}</span></summary>${ids.map(c=>`<div id="gh_${c}">${ghCard(c)}</div>`).join('')}</details>` : '';
  $('#flist').innerHTML = (GROUPS.map(([g,title])=>{ const items = fs.filter(f=>grp(f)===g); if(!items.length) return '';
    return `<details class="group" ${g!=='NOTE'?'open':''}><summary>${title} <span class="n">${items.length}</span></summary>${items.map(card).join('')}</details>`; }).join('')
    || `<div class="muted" style="padding:20px;text-align:center">${R.findings.length ? 'Нет замечаний в этой категории' : '✓ Замечаний нет'}</div>`) + fixedHtml; }

function short(s){ return (s||'').replace(/\s*\[По истории.*$/,''); }
function card(f){ const ev = (f.evidence_objects||[]).filter(o=>o.type!=='lexicon'); const fb = (R.feedback||[]).filter(x=>x.finding_id===f.finding_id && x.verdict!=='comment').slice(-1)[0];
  const llmPending = (window._job.llm_status==='pending'||window._job.llm_status==='running') && !(f.method||'').includes('LLM') && ['ERROR','RISK'].includes(f.severity);
  return `<div class="f ${grp(f)} ${sel===f._n?'sel':''}" id="f_${f._n}" onclick="select(${f._n})">
    <div class="h"><span class="num ${grp(f)}">${f._n}</span><b>${esc(CATS[f.case_category]||f.case_category)}</b><span class="muted" style="font-size:12px">${esc(f.clause_id && NUM[f.clause_id] || '')}</span><span class="sp"></span>${(f.method||'').includes('LLM')?'<span class="muted" style="font-size:11px">пояснение модели</span>':''}</div>
    <div class="short">${esc(short(f.explanation))}</div>
    <div class="body" onclick="event.stopPropagation()">
      <div class="where">📍 ${refs(f) || '—'}</div>
      ${llmPending?'<div class="llmwait"><span class="spin mini"></span> модель готовит пояснение…</div>':''}
      <p class="expl">${linkify(esc(short(f.explanation)))}</p>
      ${f.proposed_text && !/^[«…]/.test(f.proposed_text)?`<div class="hint">💡 ${esc(f.proposed_text)}</div>`:''}
      <div id="fx_${f._n}"></div>
      <div class="acts">
        ${f.clause_id?`<button class="btn small" onclick="autoFix(${f._n})">Исправить автоматически</button><button class="btn light small" onclick="manual(${f._n})">Изменить вручную</button>`:''}
        <span class="fb"><button title="Верное замечание" class="${fb&&fb.verdict==='confirm'?'on':''}" onclick="vote(${f._n},'confirm')">👍</button><button title="Ложное замечание" class="${fb&&fb.verdict==='reject'?'on':''}" onclick="vote(${f._n},'reject')">👎</button><button title="Другая категория или комментарий" onclick="more(${f._n})">⋯</button></span>
      </div>
      <div id="mo_${f._n}"></div>
      ${ev.length?`<details class="ev"><summary>Основание: ${ev.length}</summary>${ev.map(o=>`<a onclick='evid(${JSON.stringify(o).replace(/'/g,"&#39;")})'>${esc(o.id)}</a>`).join('')}</details>`:''}
    </div></div>`; }

function select(n, noScroll){ sel = n; document.querySelectorAll('.f.sel,.frag.sel').forEach(e=>e.classList.remove('sel'));
  const f = R.findings.find(x=>x._n===n); const c = $('#f_'+n);
  if (c){ const g = c.closest('details'); if (g) g.open = true; c.classList.add('sel'); if(!noScroll) c.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  const d = f && f.clause_id && document.getElementById('c_'+f.clause_id); if (d){ d.classList.add('sel'); d.scrollIntoView({block:'center',behavior:'smooth'}); } }
function evid(o){ $('#dlgbody').innerHTML = `<h3 style="margin:0 0 8px">${esc(o.id)}</h3><pre>${esc(o.text)}</pre>`; dlg.showModal(); }
function clauseText(id){ for (const b of (R.document_view||[])){ if (b.type==='p' && b.clause_id===id) return b.text; if (b.type==='table'){ const r = b.rows.find(r=>r.clause_id===id); if (r) return r.cells.join(' | '); } } return ''; }

/* ---------- word diff ---------- */
function diff(a, b){ const A = a.split(/(\s+)/), B = b.split(/(\s+)/); const n=A.length, m=B.length; const L = Array.from({length:n+1},()=>new Int16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i=0,j=0,was='',now=''; while(i<n||j<m){ if(i<n&&j<m&&A[i]===B[j]){ was+=esc(A[i]); now+=esc(B[j]); i++; j++; } else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){ now+=`<ins>${esc(B[j])}</ins>`; j++; } else { was+=`<del>${esc(A[i])}</del>`; i++; } }
  return {was, now}; }

/* ---------- auto fix ---------- */
async function autoFix(n){ const f = R.findings.find(x=>x._n===n); const box = $('#fx_'+n);
  box.innerHTML = `<div class="llmwait"><span class="spin mini"></span> Подбираем исправление…</div>`;
  const r = await fetch(`/api/reviews/${RID}/suggest`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clause_id:f.clause_id, finding_id:f.finding_id})}); const j = await r.json();
  if (!r.ok){ box.innerHTML = `<div class="hint">Ошибка: ${esc(j.detail||'')}</div>`; return; }
  if (j.proposed_text == null){ box.innerHTML = `<div class="hint">${esc(j.message)}</div>`; return; }
  const d = j.proposed_text==='' ? {was:`<del>${esc(j.original)}</del>`, now:'<i>фрагмент будет удалён</i>'} : diff(j.original, j.proposed_text);
  window._fix = {n, text:j.proposed_text, method:j.method};
  box.innerHTML = `<div class="diff"><div class="was"><span class="lbl">Было</span>${d.was}</div><div class="now"><span class="lbl">Станет</span>${d.now}</div></div>
    <div class="muted" style="font-size:12px;margin-bottom:6px">${esc(j.note||'')}${j.would_resolve===true?' · после правки замечание снимается':''}${j.options&&j.options.length>1?' · другие варианты: '+j.options.slice(1).map(o=>esc(o.code+' — '+o.name.slice(0,45))).join('; '):''}</div>
    <div class="acts"><button class="btn small" onclick="applyFix(${n})">Применить</button><button class="btn light small" onclick="manual(${n}, window._fix.text)">Изменить</button><button class="btn light small" onclick="$('#fx_${n}').innerHTML=''">Отмена</button></div>`; }
async function applyFix(n){ const fx = window._fix; if(!fx || fx.n!==n) return; await saveEdit(n, fx.text, fx.method==='llm'?'llm':'suggestion', fx.text); }
function manual(n, text){ const f = R.findings.find(x=>x._n===n); const box = $('#fx_'+n); const cur = text ?? clauseText(f.clause_id);
  box.innerHTML = `<textarea id="ta_${n}">${esc(cur)}</textarea>${f.clause_id.startsWith('T')?'<div class="muted" style="font-size:12px">ячейки таблицы разделены « | »</div>':''}
    <div class="acts" style="margin-top:6px"><button class="btn small" onclick="saveEdit(${n}, $('#ta_${n}').value, '${text!=null?'llm_edited':'manual'}', ${text!=null?'window._fix.text':'null'})">Сохранить и перепроверить</button><button class="btn light small" onclick="$('#fx_${n}').innerHTML=''">Отмена</button></div>`; $('#ta_'+n).focus(); }
async function saveEdit(n, text, method, proposed){ const f = R.findings.find(x=>x._n===n); const box = $('#fx_'+n); box.innerHTML = `<div class="llmwait"><span class="spin mini"></span> Применяем и проверяем документ заново…</div>`;
  const r = await fetch(`/api/reviews/${RID}/edits`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clause_id:f.clause_id, new_text:text, method, finding_ids:(byClause()[f.clause_id]||[]).map(x=>x.finding_id), proposed_text:proposed})});
  const j = await r.json(); if(!r.ok){ box.innerHTML = `<div class="hint">Не сохранено: ${esc(j.detail||'')}</div>`; return; }
  await openReview(RID, f.clause_id);
  if (j.resolved) toast(`Исправлено. Осталось замечаний: ${j.total_findings}.`);
  else toast(`Правка сохранена, но фрагмент всё ещё помечен (${j.findings_before} → ${j.findings_after}).`, true); }

/* ---------- feedback ---------- */
async function vote(n, verdict, cat, comment){ const f = R.findings.find(x=>x._n===n);
  const r = await fetch(`/api/reviews/${RID}/feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({verdict, finding_id:f.finding_id, correct_category:cat||null, comment:comment||null})});
  const j = await r.json(); if (!r.ok){ toast('Не сохранено: '+(j.detail||''), true); return; } R.feedback = j.feedback;
  const c = $('#f_'+n); if (c) c.outerHTML = card(f); select(n, true); toast(verdict==='confirm'?'Спасибо: отмечено как верное':verdict==='reject'?'Спасибо: отмечено как ложное':'Сохранено'); }
function more(n){ const b = $('#mo_'+n); if (b.innerHTML){ b.innerHTML=''; return; }
  b.innerHTML = `<div class="pop">Другая категория: <select onchange="if(this.value) vote(${n},'wrong_category',this.value)"><option value="">—</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    <div style="margin-top:6px"><input id="cm_${n}" placeholder="Комментарий…" style="width:70%"> <button class="btn small" onclick="if($('#cm_${n}').value.trim()) vote(${n},'comment',null,$('#cm_${n}').value)">Отправить</button></div></div>`; }
function missed(id){ document.querySelectorAll('.pop.ms').forEach(e=>e.remove()); const el = document.getElementById('c_'+id); if(!el) return;
  const p = document.createElement('div'); p.className='pop ms'; p.onclick = e=>e.stopPropagation();
  p.innerHTML = `<b>Здесь есть проблема, которую система пропустила?</b><div style="margin:6px 0"><select id="mc">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select> <input id="mcm" placeholder="что не так"></div>
    <button class="btn small" onclick="sendMissed('${id}')">Сообщить</button> <button class="btn light small" onclick="this.closest('.pop').remove()">Отмена</button>`;
  (el.closest('p')||el).insertAdjacentElement('afterend', p); }
async function sendMissed(id){ const r = await fetch(`/api/reviews/${RID}/feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({verdict:'missed', clause_id:id, correct_category:$('#mc').value, comment:$('#mcm').value||null})});
  if (r.ok){ document.querySelectorAll('.pop.ms').forEach(e=>e.remove()); toast('Спасибо: это поможет улучшить проверку'); } }

/* ---------- downloads ---------- */
function dl(kind){ $('#dl').classList.remove('open'); if(!RID) return;
